name: Preview Deploy (Firebase Hosting)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Preview channel id'
        required: false
        default: 'preview'
  push:
    branches:
      - claude/test-coverage-analysis-udnk2o
    paths:
      - .github/workflows/preview-deploy.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx firebase-tools hosting:channel:deploy ${{ github.event.inputs.channel || 'calendario' }} --project thejunglefilms-templates --expires 7d
