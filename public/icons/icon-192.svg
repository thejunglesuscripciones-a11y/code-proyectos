<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#235347"/>
      <stop offset="100%" stop-color="#163832"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DAF1DE" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#DAF1DE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#051F20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g clip-path="url(#clip)" stroke="#8EB69B" fill="none" stroke-linecap="round">
    <path d="M-40 120 C 90 90, 160 170, 280 130 S 470 60, 560 110" stroke-opacity="0.16" stroke-width="3"/>
    <path d="M-40 210 C 100 260, 190 190, 300 230 S 460 300, 560 240" stroke-opacity="0.14" stroke-width="3"/>
    <path d="M-40 320 C 80 280, 200 360, 320 310 S 480 260, 560 320" stroke-opacity="0.13" stroke-width="3"/>
    <path d="M-40 410 C 110 440, 210 380, 330 420 S 470 470, 560 420" stroke-opacity="0.12" stroke-width="3"/>
    <path d="M-40 60 C 60 40, 140 80, 240 55" stroke-opacity="0.10" stroke-width="2.5"/>
  </g>

  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <text x="256" y="308" font-size="168" font-weight="700" text-anchor="middle" fill="#ffffff"
        font-family="'Segoe UI', system-ui, sans-serif" letter-spacing="4" filter="url(#shadow)">TJF</text>
</svg>
